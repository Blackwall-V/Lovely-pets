# Hyprland window rules for Lovely-pets
#
# Match by ``class`` because the application sets
# ``QApplication.applicationName = "lovely-pet"`` in lovely_pet/app.py,
# which becomes the XDG ``WM_CLASS`` that Hyprland matches against.
#
# To install:
#   cat hyprland/windowrulev2.conf >> ~/.config/hypr/hyprland.conf
#   hyprctl reload
#
# To verify a running session is picking them up:
#   hyprctl clients | grep lovely-pet

# float: ignore the tiling layout
windowrulev2 = float,       class:^(lovely-pet)$

# pin: appear on every workspace
windowrulev2 = pin,         class:^(lovely-pet)$

# nofocus: never steal keyboard focus from the user's active window
windowrulev2 = nofocus,     class:^(lovely-pet)$

# noanim: skip the compositor's open/close animations
windowrulev2 = noanim,      class:^(lovely-pet)$

# noshadow: a server-side shadow would draw a black halo around
#           the transparent GIF edges
windowrulev2 = noshadow,    class:^(lovely-pet)$

# noblur: layer-blur would smear the transparent pixels
windowrulev2 = noblur,      class:^(lovely-pet)$

# nomaxsize: don't snap to full screen on accidental focus
windowrulev2 = nomaxsize,   class:^(lovely-pet)$

# passthrough: the compositor-level click-through. Pairs with
#              Qt.WindowType.WindowTransparentForInput from the app
#              for a belt-and-suspenders setup.
windowrulev2 = passthrough, class:^(lovely-pet)$
